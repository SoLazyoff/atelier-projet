<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier – créer ma marque de vêtements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Bebas+Neue&family=Syne:wght@800&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eaec; --panel:#f5f5f3; --ink:#16171a; --mute:#5d6068; --line:#c8cad0;
  --acc:#c8283c; --accInk:#ffffff; --focus:#0a64d8; --good:#1c7a45; --bad:#b3261e;
  color-scheme: light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141518; --panel:#1c1e22; --ink:#efeee8; --mute:#9a9da6; --line:#33363d;
    --acc:#ef5a6e; --accInk:#17080b; --focus:#6aa9ff; --good:#58c98a; --bad:#ff8a80;
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141518; --panel:#1c1e22; --ink:#efeee8; --mute:#9a9da6; --line:#33363d;
  --acc:#ef5a6e; --accInk:#17080b; --focus:#6aa9ff; --good:#58c98a; --bad:#ff8a80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;padding-bottom:84px;-webkit-text-size-adjust:100%}
button,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mark{font-weight:850;font-stretch:125%;font-size:20px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mute);font-size:13px;white-space:nowrap}
.hdr-r{display:flex;align-items:center;gap:10px;flex:none}
.themebtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 11px;font-weight:600;font-size:12.5px;white-space:nowrap}
@media (max-width:440px){.bar .sub{display:none}}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{position:relative;background:none;border:0;color:var(--mute);padding:14px 1px 13px;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:440px){.tabs button{font-size:11px}}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;left:22%;right:22%;top:-1px;height:3px;background:var(--acc)}

.stage{position:relative;background:linear-gradient(#e8e9ec,#b2b5bb)}
.stage svg{display:block;width:100%;height:min(62svh,520px)}
.stage path[data-p]{cursor:pointer}
.seg{display:inline-flex;border:1px solid rgba(0,0,0,.28);background:rgba(255,255,255,.78);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:9px 15px;font-weight:600;font-size:13.5px;color:#16171a}
.seg button[aria-pressed="true"]{background:#16171a;color:#fff}
.float-l{position:absolute;left:12px;top:12px}
.roll{position:absolute;right:12px;top:12px;border:1px solid rgba(0,0,0,.28);background:rgba(255,255,255,.78);color:#16171a;border-radius:999px;padding:9px 15px;font-weight:600;font-size:13.5px}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12.5px;color:#3b3d42}

.pad{padding:16px}
h2{font-size:15.5px;font-weight:750;font-stretch:112%;margin:24px 0 9px}
h2:first-child{margin-top:4px}
.mute{color:var(--mute)}
.small{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;font-weight:500;font-size:14px}
.modebar{padding:12px 16px 10px;display:grid;gap:8px;background:var(--bg)}
.seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg2 button{border:0;background:none;padding:11px 6px;font-weight:650;font-size:14px;color:var(--ink)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pcs .preset{flex:0 0 110px}
.pcs .preset .th svg{height:130px}
.preset[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.hs{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .chip{flex:none;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.7);flex:none}
.pal{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--bg);outline:1px solid var(--line);padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--ink)}
.colorin{width:34px;height:34px;padding:0;border:0;background:none;border-radius:50%;cursor:pointer}
.primary{width:100%;background:var(--acc);color:var(--accInk);border:0;border-radius:10px;padding:14px;font-weight:700;font-size:16px}
.primary:disabled{opacity:.45}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mockroom{background:#0e0e10;color:#f2f2f0;padding:6px 16px 28px;min-height:60vh}
.mockroom h2{color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}
@media (min-width:600px){.mgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.mtile{background:none;border:0;padding:8px 4px;color:#e8e8e6;font-size:12px;font-weight:500;line-height:1.25;text-align:center;border-radius:10px}
.mtile svg{display:block;width:100%;height:78px;margin-bottom:6px}
.mtile.mine{background:#1f2024}
.mtile[aria-pressed="true"]{outline:2px solid #f2f2f0}
.mtile[hidden]{display:none}
.mmute{color:#9a9da6;font-size:13px;margin:0}
.mfilters{display:grid;gap:10px;margin-bottom:16px}
.mockroom .chip{background:#1f2024;color:#e8e8e6;border-color:#36383e}
.mockroom .chip[aria-pressed="true"]{background:#f2f2f0;color:#0e0e10;border-color:#f2f2f0}
.msearch{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #36383e;background:#1f2024;color:#f2f2f0;font:inherit;font-size:15px}
.mactions{margin:14px 0 4px;padding:12px;border-radius:12px;background:#1f2024}
.mactions .row2{margin-top:10px}
.mactions .ghost{color:#f2f2f0;border-color:#3a3d44;width:100%}
.flat{margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.flat svg{display:block;width:100%;height:210px}
.flat figcaption{text-align:center;font-size:12.5px;font-weight:600;padding:4px;color:#111}
.tblw{overflow-x:auto;margin:0 -14px;padding:0 14px}
table.spec{border-collapse:collapse;font-size:13px;min-width:100%}
.spec th,.spec td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.spec td:nth-child(2){text-align:left;white-space:normal;min-width:130px}
.spec input{width:58px;padding:5px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;text-align:center}
.spec input.custom{border-color:var(--acc);border-width:2px}
.lt{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#c8283c;color:#fff;font-size:11px}
#print{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important;color:#111!important;padding:0}
  body>*:not(#print){display:none!important}
  #print{display:block;font:400 11pt/1.45 'Archivo',system-ui,sans-serif;color:#111}
  #print header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:14px}
  #print header b{font-size:20pt;font-weight:850;font-stretch:125%}
  #print .views{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;break-inside:avoid}
  #print figure{margin:0;background:linear-gradient(#e8e9ec,#b2b5bb);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print figure svg{display:block;width:100%;height:105mm}
  #print .flats figure{background:#fff;border:1px solid #bbb}
  #print figcaption{text-align:center;font-weight:650;padding:4px 0;background:#fff}
  #print p{margin:0}
  #print .h{font-weight:750;margin-top:8px}
  #print .t{font-weight:750;font-size:13pt}
  #print .psw{display:inline-block;width:11pt;height:11pt;border:1px solid #0005;vertical-align:-2pt;margin-right:6pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.scroller{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity}
.preset{flex:0 0 118px;scroll-snap-align:start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 0 9px;overflow:hidden;color:var(--ink)}
.preset .th{background:linear-gradient(#e8e9ec,#b2b5bb)}
.preset svg{display:block;width:100%;height:150px}
.preset span{display:block;padding:7px 9px 0;font-size:12.5px;font-weight:600;line-height:1.25}

.field{margin:0 0 14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:5px}
.field input,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:16px;font-weight:500}
.field textarea{min-height:110px;resize:vertical;line-height:1.45}
.logos{display:grid;gap:12px;margin-top:12px}
.logos svg{display:block;width:100%;height:auto;border-radius:6px}
.logos .mini{display:flex;gap:12px;align-items:center}
.logos .mini>div:first-child{flex:1 1 auto}
.logos .mini>div:last-child{flex:0 0 92px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.look{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.look .th{background:linear-gradient(#e8e9ec,#b2b5bb)}
.look svg{display:block;width:100%;height:190px}
.look .in{padding:10px}
.look input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font-size:15px;font-weight:650;padding:2px 0 6px;margin-bottom:8px}
.look .acts{display:flex;gap:6px;flex-wrap:wrap}
.look .acts button{flex:1 1 auto;padding:8px 6px;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:8px;background:none;color:var(--ink)}
.sheet{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.sheet pre{margin:0 0 12px;white-space:pre-wrap;font:500 13.5px/1.55 'Archivo',sans-serif}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.kpi{border-top:3px solid var(--ink);padding:8px 0 4px}
.kpi b{display:block;font-size:22px;font-weight:800;font-stretch:112%;letter-spacing:-.01em}
.kpi span{font-size:13px;color:var(--mute)}
.kpi.neg{border-color:var(--bad)} .kpi.neg b{color:var(--bad)}
.kpi.pos{border-color:var(--good)}
.numgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.checks{list-style:none;margin:0;padding:0}
.checks li{border-bottom:1px solid var(--line)}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:12px 2px}
.checks input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--acc);flex:none}
.checks .done{color:var(--mute);text-decoration:line-through}
.checks small{display:block;color:var(--mute);font-size:12.5px}
.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.shp{height:48px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0}
.shp[aria-pressed="true"]{border-color:var(--ink);outline:2px solid var(--ink)}
.field input[type=range]{padding:0;border:0;background:none;height:32px;accent-color:var(--acc)}
.note{font-size:13px;color:var(--bad);margin:8px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .15s}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (min-width:700px){main{max-width:640px;margin:0 auto}.stage{border-radius:0 0 14px 14px}}
</style>
</head>
<body>
<header class="bar"><div class="mark" id="hdrName"></div><div class="hdr-r"><div class="sub">Atelier de création</div><button class="themebtn" id="themeBtn" data-act="theme"></button></div></header>
<main id="app"></main>
<nav class="tabs" id="tabs" role="tablist">

/* coupe une ligne en morceaux qui tiennent dans maxW (measure = largeur d'un texte) */
function wrapText(t,maxW,measure){const out=[];let cur='';t.split(' ').forEach(w=>{const n=cur?cur+' '+w:w;if(cur&&measure(n)>maxW){out.push(cur);cur=w}else cur=n});if(cur)out.push(cur);return out.length?out:['']}
const vbOf=svg=>{const m=svg.match(/viewBox="([^"]+)"/),v=(m?m[1]:'0 0 300 514').split(/\s+/).map(Number);return {w:v[2],h:v[3]}};
async function svgImg(svg,w,h){const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ',`<svg width="${w}" height="${h}" `));await img.decode();return img}
/* même mise en page que la version imprimable, dessinée dans un canvas de 1240 px de large */
async function sheetPng(d){
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const W=1240,P=64,BW=(W-2*P-24)/2,BH=720,TOP=170,FF="'Archivo',system-ui,sans-serif";
  const cv=document.createElement('canvas'),x=cv.getContext('2d'),rows=[];
  d.text.split('\n').forEach((t,i)=>{
    if(!t.trim()){rows.push({gap:1});return}
    const item=t.startsWith('- '),hx=(t.match(/\((#[0-9a-fA-F]{6})\)/)||[])[1],bold=!item&&(i===0||!t.includes(' : ')),ind=item&&hx?44:0;
    x.font=`${bold?700:400} 28px ${FF}`;
    wrapText(item?t.slice(2):t,W-2*P-ind,s=>x.measureText(s).width).forEach((l,j)=>rows.push({t:l,bold,ind,hx:j?null:hx}));
  });
  const FH=d.flats?560:0,FT=TOP+BH+70,TY=FT+(FH?FH+70:0);
  cv.width=W;cv.height=TY+rows.reduce((a,r)=>a+(r.gap?16:40),0)+P;
  x.fillStyle='#fff';x.fillRect(0,0,W,cv.height);
  x.fillStyle='#111';x.font=`800 52px ${FF}`;x.fillText(S.brand.name||'Ma marque',P,104);
  x.font=`400 26px ${FF}`;x.textAlign='right';x.fillText('Fiche technique · '+today(),W-P,104);x.textAlign='left';
  x.fillRect(P,128,W-2*P,4);
  const svgs=sheetViews(d.G,'png');
  for(let i=0;i<2;i++){
    const bx=P+i*(BW+24),g=x.createLinearGradient(0,TOP,0,TOP+BH);g.addColorStop(0,'#e8e9ec');g.addColorStop(1,'#b2b5bb');
    x.fillStyle=g;x.fillRect(bx,TOP,BW,BH);
    const vb=vbOf(svgs[i]),k=Math.min(BW/vb.w,BH/vb.h),w=Math.round(vb.w*k),h=Math.round(vb.h*k);
    x.drawImage(await svgImg(svgs[i],w,h),bx+(BW-w)/2,TOP+(BH-h)/2,w,h);
    x.fillStyle='#111';x.font=`650 26px ${FF}`;x.textAlign='center';x.fillText(i?'Dos':'Face',bx+BW/2,TOP+BH+40);x.textAlign='left';
  }
  if(d.flats)for(let i=0;i<2;i++){
    const bx=P+i*(BW+24);x.fillStyle='#fff';x.fillRect(bx,FT,BW,FH);x.strokeStyle='#bbb';x.lineWidth=2;x.strokeRect(bx,FT,BW,FH);
    const vb=vbOf(d.flats[i]),k=Math.min((BW-20)/vb.w,(FH-20)/vb.h),w=Math.round(vb.w*k),h=Math.round(vb.h*k);
    x.drawImage(await svgImg(d.flats[i],w,h),bx+(BW-w)/2,FT+(FH-h)/2,w,h);
    x.fillStyle='#111';x.font=`650 26px ${FF}`;x.textAlign='center';x.fillText('Dessin à plat · '+(i?'dos':'face'),bx+BW/2,FT+FH+40);x.textAlign='left';
  }
  let y=TY;
  rows.forEach(r=>{
    if(r.gap){y+=16;return}
    y+=40;
    if(r.hx){x.fillStyle=r.hx;x.fillRect(P,y-26,28,28);x.strokeStyle='#0006';x.lineWidth=1.5;x.strokeRect(P,y-26,28,28)}
    x.fillStyle='#111';x.font=`${r.bold?700:400} 28px ${FF}`;x.fillText(r.t,P+r.ind,y);
  });
  return new Promise(res=>cv.toBlob(res,'image/png'));
}
/* partage natif quand le téléphone sait envoyer un fichier (WhatsApp, mail…), sinon téléchargement */
async function exportPng(d){
  toast('Préparation de l’image…');
  let blob;try{blob=await sheetPng(d)}catch(e){toast('Image impossible ici : utilise PDF');return}
  const name=fileName(d.name,'png'),file=new File([blob],name,{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:d.name});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Image enregistrée');
}

function bizCalc(){
  const b=S.biz,n=v=>Number(v)||0;
  const net=n(b.price)*(1-n(b.fee)/100);
  const um=net-n(b.cost)-n(b.ship);
  const pct=n(b.price)>0?um/n(b.price)*100:0;
  const be=um>0?Math.ceil(n(b.fixed)/um):Infinity;
  const inv=n(b.cost)*n(b.qty)+n(b.fixed);
  const all=um*n(b.qty)-n(b.fixed);
  const k=(v,l,cls)=>`<div class="kpi ${cls||''}"><b>${v}</b><span>${l}</span></div>`;
  $('#kpis').innerHTML=k(eur(um),'Marge par pièce',um>0?'pos':'neg')+k(pct.toFixed(0)+' %','Marge sur le prix de vente',um>0?'pos':'neg')+k(isFinite(be)?be+' pièces':'Jamais','Pour rentrer dans tes frais',isFinite(be)?'':'neg')+k(eur(inv),'Investissement de départ')+k(eur(all),'Bénéfice si tout est vendu',all>=0?'pos':'neg');
  $('#mult').textContent=`Repère courant : prix de vente entre ×2,5 et ×3 le coût de production, soit ${eur(n(b.cost)*2.5)} à ${eur(n(b.cost)*3)}.`;

/* ---------- événements ---------- */

    case 'view':S.view=k;break;

    case 'accGroup':S.accGroup=k;S.editId=null;S.sel=ACC[k].z;break;

    case 'savePiece':case 'savePieceNew':{
      const np=makePiece(),ex=(a==='savePiece')&&S.editId&&S.looks.find(l=>l.id===S.editId&&l.kind==='piece'&&l.cat===S.cat);

    case 'col':S.c[S.sel]=k;break;

    case 'fabric':S.fabric=k;break;
    case 'preset':{const p=PRESETS[+k];S.pat=Object.assign({},DEF.pat);S.top=p.top;S.bottom=p.bottom;S.fabric=p.fabric;S.fabricB=p.fabric;S.c=fixC(Object.assign({},S.c,p.c,{stitchB:p.c.stitch}));S.acc=Object.assign({},ACC0,p.acc||{});break}

    case 'save':{
      const n=S.looks.filter(l=>l.kind!=='piece').length+1;
      S.looks.push({id:Date.now(),kind:'outfit',name:'Tenue '+n,top:S.top,bottom:S.bottom,fabric:S.fabric,fabricB:S.fabricB,pat:Object.assign({},S.pat),c:Object.assign({},S.c),acc:Object.assign({},S.acc),marks:JSON.parse(JSON.stringify(S.marks))});
      persist();toast('Tenue ajoutée à ta collection');return;
    }
    case 'mksel':S.mi=+k;{const mm=S.marks[S.mi];if(mm)S.view=PL[mm.place].v==='b'?'back':'front'}break;
    case 'mkadd':{
      if(S.marks.length>=8)return;
      const used=S.marks.map(x=>x.place),free=Object.keys(PL).filter(x=>!used.includes(x)&&x!=='cap'&&(S.mode!=='piece'||MARKCAT[x]===S.cat));
      const m=newMark({place:free[0]||'chest-l'});S.marks.push(m);S.mi=S.marks.length-1;S.view=PL[m.place].v==='b'?'back':'front';break;
    }
    case 'mkdel':S.marks.splice(S.mi,1);S.mi=Math.max(0,S.mi-1);break;
    case 'mkkind':if(S.marks[S.mi])S.marks[S.mi].kind=k;break;
    case 'mkshape':if(S.marks[S.mi])S.marks[S.mi].shape=k;break;
    case 'mkfont':if(S.marks[S.mi])S.marks[S.mi].font=k;break;
    case 'mkplace':if(S.marks[S.mi]){S.marks[S.mi].place=k;S.view=PL[k].v==='b'?'back':'front'}break;
    case 'mktech':if(S.marks[S.mi])S.marks[S.mi].tech=k;break;
    case 'mkcol':if(S.marks[S.mi])S.marks[S.mi].color=k;break;
    case 'mkbg':if(S.marks[S.mi])S.marks[S.mi].bg=k;break;
    case 'mkquick':{
      QUICK[+k].marks.forEach(q=>{if(S.marks.length<8)S.marks.push(newMark(q))});
      S.mi=S.marks.length-1;S.view=PL[S.marks[S.mi].place].v==='b'?'back':'front';break;
    }
    case 'names':genNames();break;
    case 'useName':S.brand.name=k;break;
    case 'vibe':{const v=S.brand.vibes,i=v.indexOf(k);i>=0?v.splice(i,1):v.push(k);break}
    case 'genMan':S.brand.manifesto=manifesto();break;
    case 'logo':S.brand.logo=k;break;
    case 'logoBg':S.brand.bg=k;break;
    case 'logoFg':S.brand.fg=k;break;
    case 'openLook':{const l=S.looks.find(x=>x.id==k);if(l){S.top=l.top;S.bottom=l.bottom;S.fabric=l.fabric;S.fabricB=l.fabricB||l.fabric;S.pat=Object.assign({},DEF.pat,l.pat||{});S.mode='outfit';S.editId=null;S.c=fixC(Object.assign({},ACCC,l.c));S.acc=Object.assign({},ACC0,l.acc||{});S.marks=(l.marks||[]).map(m=>Object.assign({},DEFMARK,m));S.mi=0;S.view='front';go('studio')}return}
    case 'sheet':openSheet=(openSheet==+k)?null:+k;break;
    case 'collView':S.collView=k;break;
    case 'libCat':S.libCat=k;break;
    case 'mockSel':selMock=(selMock==+k)?null:+k;renderTab();{const e=$('.mactions');if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth',block:'nearest'})}return;
    case 'mockGo':{
      S.collView='fiches';if(el.dataset.to==='patron')openPatron=+k;else openSheet=+k;persist();renderTab();
      const e=$(el.dataset.to==='patron'?'.patron':'.sheet');if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth',block:'start'});return;
    }
    case 'libUse':{
      const cat=el.dataset.cat;S.mode='piece';S.cat=cat;S[cat]=k;S.editId=null;S.view='front';S.sel=Object.keys(zonesOf(S))[0];
      toast((cat==='top'?TOPS:BOTTOMS)[k].label+' ouvert dans l’Atelier');go('studio');return;
    }
    case 'patron':openPatron=(openPatron==+k)?null:+k;persist();renderTab();{const e=$('.patron');if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth',block:'start'})}return;
    case 'specReset':{const p=S.looks.find(x=>x.id==k);if(p)delete p.spec;toast('Mesures standard rétablies');break}
    case 'del':
      if(pendingDel==+k){S.looks=S.looks.filter(x=>x.id!=k);pendingDel=null;if(openSheet==+k)openSheet=null;if(openPatron==+k)openPatron=null;lbForget(+k)}
      else{pendingDel=+k;const n=lbUses(+k);if(n)toast(`Utilisée dans ${n} look${n>1?'s':''} du Lookbook`);setTimeout(()=>{if(pendingDel==+k){pendingDel=null;if(S.tab==='coll')renderTab()}},3000)}
      break;
    case 'copy':{
      const l=S.looks.find(x=>x.id==k);if(!l)return;
      copyText(sheetText(l));return;
    }
    case 'shImg':{const d=sheetData(el.dataset.kind,k);if(d)exportPng(d);return}
    case 'shPdf':{const d=sheetData(el.dataset.kind,k);if(d)exportPdf(d);return}
    case 'lbCopy':{const l=S.lookbook.find(x=>x.id==k);if(l)copyText(lbText(l));return}
    case 'lbPick':{
      const p=pieceById(+k),d=S.lb;if(!p)return;
      if(p.cat==='acc'){if(d.acc[p.group]===p.id)delete d.acc[p.group];else d.acc[p.group]=p.id}
      else d[p.cat]=d[p.cat]===p.id?null:p.id;
      break;
    }
    case 'lbView':S.lb.view=k;break;
    case 'lbRandom':{const pick=a=>a[Math.floor(Math.random()*a.length)],t=piecesOf('top'),b=piecesOf('bottom');if(t.length)S.lb.top=pick(t).id;if(b.length)S.lb.bottom=pick(b).id;break}
    case 'lbSave':{
      const d=S.lb;if(!pieceById(d.top)||!pieceById(d.bottom))return;
      S.lookbook.push({id:Date.now(),name:'Look '+(S.lookbook.length+1),top:d.top,bottom:d.bottom,acc:Object.assign({},d.acc)});
      toast('Look ajouté au Lookbook');break;
    }
    case 'lbOpen':{
      const l=S.lookbook.find(x=>x.id==k);if(!l)return;const G=lookG(l);
      Object.assign(S,{top:G.top,bottom:G.bottom,fabric:G.fabric,fabricB:G.fabricB,pat:G.pat,c:fixC(Object.assign({},ACCC,G.c)),acc:G.acc,marks:G.marks,mi:0,mode:'outfit',editId:null,view:'front',sel:'tBody'});
      go('studio');return;
    }
    case 'lbSheet':lbSheetId=(lbSheetId==+k)?null:+k;break;
    case 'lbDel':
      if(lbPending==+k){S.lookbook=S.lookbook.filter(x=>x.id!=k);lbPending=null;if(lbSheetId==+k)lbSheetId=null}
      else{lbPending=+k;setTimeout(()=>{if(lbPending==+k){lbPending=null;if(S.tab==='look')renderTab()}},3000)}
      break;
    case 'mult':{S.biz.price=Math.round((Number(S.biz.cost)||0)*Number(k)*100)/100;break}
    default:return;
  }
  persist();renderTab();
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset.in;if(!k)return;
  if(k.startsWith('mk.')){
    const m=S.marks[S.mi];if(!m)return;const pr=k.slice(3);
    m[pr]=(pr==='size'||pr==='rot'||pr==='dx'||pr==='dy')?parseFloat(t.value):t.value;
    if(pr==='size'){const e=$('#mkcm');if(e)e.textContent=cmOf(m)+' cm'}
    refreshStage();persist();return;
  }
  if(k==='custom'){S.c[S.sel]=t.value;refreshStage();persist();return}
  if(k==='name'){S.brand.name=t.value;setHeader();refreshLogo();persist();return}
  if(k==='tag'){S.brand.tag=t.value;refreshLogo();persist();return}
  if(k==='manifesto'){S.brand.manifesto=t.value;persist();return}
  if(k==='libq'){
    libQ=t.value;let n=0;
    document.querySelectorAll('#libGrid .mtile').forEach(b=>{const ok=libHit({q:b.dataset.q},libQ);b.hidden=!ok;if(ok)n++});
    const none=$('#libNone');if(none)none.hidden=n>0;return;
  }
  if(k==='spec'){
    const p=S.looks.find(x=>x.id==t.dataset.id);if(!p)return;const v=parseFloat(t.value),key=t.dataset.k;
    p.spec=Object.assign({},p.spec);if(Number.isFinite(v)&&v>0)p.spec[key]=v;else delete p.spec[key];
    const r=specRows(p).find(x=>x.k===key);if(r)r.vals.forEach((x,i)=>{const c=document.getElementById(`sp-${key}-${i}`);if(c)c.textContent=cm(x)});
    t.classList.toggle('custom',key in p.spec);persist();return;
  }
  if(k==='lbname'){const l=S.lookbook.find(x=>x.id==t.dataset.id);if(l)l.name=t.value;persist();return}
  if(k==='lname'){const l=S.looks.find(x=>x.id==t.dataset.id);if(l)l.name=t.value;persist();return}
  if(k.startsWith('biz.')){S.biz[k.slice(4)]=t.value===''?0:parseFloat(t.value);bizCalc();persist();return}
  if(k==='chk'){S.checks[t.dataset.id]=t.checked;persist();const sp=t.nextElementSibling;if(sp)sp.className=t.checked?'done':'';return}
});
applyTheme();
renderTab();
</script>
</body>
</html>
