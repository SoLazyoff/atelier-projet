<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier – créer ma marque de vêtements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Bebas+Neue&family=Syne:wght@800&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eaec; --panel:#f5f5f3; --ink:#16171a; --mute:#5d6068; --line:#c8cad0;
  --acc:#c8283c; --accInk:#ffffff; --focus:#0a64d8; --good:#1c7a45; --bad:#b3261e;
  color-scheme: light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141518; --panel:#1c1e22; --ink:#efeee8; --mute:#9a9da6; --line:#33363d;
    --acc:#ef5a6e; --accInk:#17080b; --focus:#6aa9ff; --good:#58c98a; --bad:#ff8a80;
  }
}
:root[data-theme="dark"]{
  --bg:#141518; --panel:#1c1e22; --ink:#efeee8; --mute:#9a9da6; --line:#33363d;
  --acc:#ef5a6e; --accInk:#17080b; --focus:#6aa9ff; --good:#58c98a; --bad:#ff8a80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;padding-bottom:84px;-webkit-text-size-adjust:100%}
button,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mark{font-weight:850;font-stretch:125%;font-size:20px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mute);font-size:13px;white-space:nowrap}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{position:relative;background:none;border:0;color:var(--mute);padding:14px 2px 13px;font-weight:600;font-size:12.5px}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;left:22%;right:22%;top:-1px;height:3px;background:var(--acc)}

.stage{position:relative;background:linear-gradient(#e8e9ec,#b2b5bb)}
.stage svg{display:block;width:100%;height:min(62svh,520px)}
.stage path[data-p]{cursor:pointer}
.seg{display:inline-flex;border:1px solid rgba(0,0,0,.28);background:rgba(255,255,255,.78);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:9px 15px;font-weight:600;font-size:13.5px;color:#16171a}
.seg button[aria-pressed="true"]{background:#16171a;color:#fff}
.float-l{position:absolute;left:12px;top:12px}
.roll{position:absolute;right:12px;top:12px;border:1px solid rgba(0,0,0,.28);background:rgba(255,255,255,.78);color:#16171a;border-radius:999px;padding:9px 15px;font-weight:600;font-size:13.5px}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12.5px;color:#3b3d42}

.pad{padding:16px}
h2{font-size:15.5px;font-weight:750;font-stretch:112%;margin:24px 0 9px}
h2:first-child{margin-top:4px}
.mute{color:var(--mute)}
.small{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;font-weight:500;font-size:14px}
.modebar{padding:12px 16px 10px;display:grid;gap:8px;background:var(--bg)}
.seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg2 button{border:0;background:none;padding:11px 6px;font-weight:650;font-size:14px;color:var(--ink)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pcs .preset{flex:0 0 110px}
.pcs .preset .th svg{height:130px}
.hs{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .chip{flex:none;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.7);flex:none}
.pal{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--bg);outline:1px solid var(--line);padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--ink)}
.colorin{width:34px;height:34px;padding:0;border:0;background:none;border-radius:50%;cursor:pointer}
.primary{width:100%;background:var(--acc);color:var(--accInk);border:0;border-radius:10px;padding:14px;font-weight:700;font-size:16px}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.scroller{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity}
.preset{flex:0 0 118px;scroll-snap-align:start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 0 9px;overflow:hidden;color:var(--ink)}
.preset .th{background:linear-gradient(#e8e9ec,#b2b5bb)}
.preset svg{display:block;width:100%;height:150px}
.preset span{display:block;padding:7px 9px 0;font-size:12.5px;font-weight:600;line-height:1.25}

.field{margin:0 0 14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:5px}
.field input,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:16px;font-weight:500}
.field textarea{min-height:110px;resize:vertical;line-height:1.45}
.logos{display:grid;gap:12px;margin-top:12px}
.logos svg{display:block;width:100%;height:auto;border-radius:6px}
.logos .mini{display:flex;gap:12px;align-items:center}
.logos .mini>div:first-child{flex:1 1 auto}
.logos .mini>div:last-child{flex:0 0 92px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.look{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.look .th{background:linear-gradient(#e8e9ec,#b2b5bb)}
.look svg{display:block;width:100%;height:190px}
.look .in{padding:10px}
.look input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font-size:15px;font-weight:650;padding:2px 0 6px;margin-bottom:8px}
.look .acts{display:flex;gap:6px;flex-wrap:wrap}
.look .acts button{flex:1 1 auto;padding:8px 6px;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:8px;background:none;color:var(--ink)}
.sheet{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.sheet pre{margin:0 0 12px;white-space:pre-wrap;font:500 13.5px/1.55 'Archivo',sans-serif}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.kpi{border-top:3px solid var(--ink);padding:8px 0 4px}
.kpi b{display:block;font-size:22px;font-weight:800;font-stretch:112%;letter-spacing:-.01em}
.kpi span{font-size:13px;color:var(--mute)}
.kpi.neg{border-color:var(--bad)} .kpi.neg b{color:var(--bad)}
.kpi.pos{border-color:var(--good)}
.numgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.checks{list-style:none;margin:0;padding:0}
.checks li{border-bottom:1px solid var(--line)}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:12px 2px}
.checks input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--acc);flex:none}
.checks .done{color:var(--mute);text-decoration:line-through}
.checks small{display:block;color:var(--mute);font-size:12.5px}
.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.shp{height:48px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0}
.shp[aria-pressed="true"]{border-color:var(--ink);outline:2px solid var(--ink)}
.field input[type=range]{padding:0;border:0;background:none;height:32px;accent-color:var(--acc)}
.note{font-size:13px;color:var(--bad);margin:8px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .15s}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (min-width:700px){main{max-width:640px;margin:0 auto}.stage{border-radius:0 0 14px 14px}}
</style>
</head>

function refreshLogo(){

function setHeader(){$('#hdrName').textContent=S.brand.name||'Ma marque'}

/* ---------- onglet Collection ---------- */
let openSheet=null,pendingDel=null;
function sheetText(L){
  if(L.kind==='piece'){
    let t=`Fiche technique (pièce) : ${L.name}\nMarque : ${S.brand.name}\n\n`;
    if(L.cat==='top'){t+=`Haut : ${TOPS[L.top].label}\nMatière : ${FABRICS[L.fabric]}\n\nCouleurs\n`;const Z=TOPS[L.top].zones;Object.keys(Z).forEach(k=>{t+=`- ${Z[k]} : ${colorName(L.c[k])} (${L.c[k]})\n`});t+=`- Surpiqûres et liserés : ${colorName(L.c.stitch)} (${L.c.stitch})\n`}
    else if(L.cat==='bottom'){t+=`Bas : ${BOTTOMS[L.bottom].label}\nMatière : ${FABRICS[L.fabricB||L.fabric]}\n\nCouleurs\n`;const Z=BOTTOMS[L.bottom].zones;Object.keys(Z).forEach(k=>{t+=`- ${Z[k]} : ${colorName(L.c[k])} (${L.c[k]})\n`});t+=`- Surpiqûres et liserés : ${colorName(L.c.stitchB)} (${L.c.stitchB})\n`}
    else{const z=ACC[L.group].z;t+=`Accessoire : ${ACC[L.group].label}, ${ACC[L.group].opts[L.opt]}\nCouleur : ${colorName(L.c[z])} (${L.c[z]})\n`}
    if(L.marks&&L.marks.length){t+='\nMarquage (logos)\n';L.marks.forEach((m,i)=>{t+='- '+markDesc(Object.assign({},DEFMARK,m),i)+'\n'})}
    return t;
  }
  const T=TOPS[L.top],B=BOTTOMS[L.bottom],Z=Object.assign({},T.zones,B.zones);
  let s=`Fiche technique : ${L.name}\nMarque : ${S.brand.name}\n\nHaut : ${T.label}\nBas : ${B.label}\nMatière : ${FABRICS[L.fabric]}\n\nCouleurs\n`;
  Object.keys(Z).forEach(k=>{s+=`- ${Z[k]} : ${colorName(L.c[k])} (${L.c[k]})\n`});
  s+=`- Surpiqûres et liserés : ${colorName(L.c.stitch)} (${L.c.stitch})\n`;
  const ac=Object.assign({},ACC0,L.acc||{});
  Object.keys(ACC).forEach(g=>{if(ac[g]!=='none'){const z=ACC[g].z,col=(L.c[z]||ACCC[z]);s+=`- ${ACC[g].label} : ${ACC[g].opts[ac[g]]}, ${colorName(col)} (${col})\n`}});
  if(L.marks&&L.marks.length){s+='\nMarquage (logos)\n';L.marks.forEach((m,i)=>{s+='- '+markDesc(Object.assign({},DEFMARK,m),i)+'\n'})}
  return s;
}
function lookCard(l){
  const isP=l.kind==='piece';
  const th=isP?pieceThumb(l,'c'+l.id):build({top:l.top,bottom:l.bottom,fabric:l.fabric,fabricB:l.fabricB,view:'front',c:l.c,acc:l.acc,marks:l.marks},'c'+l.id,null);
  return `<div class="look"><div class="th">${th}</div><div class="in"><input data-in="lname" data-id="${l.id}" value="${esc(l.name)}" aria-label="Nom" maxlength="40"><div class="acts"><button data-act="${isP?'openPiece':'openLook'}" data-k="${l.id}">Ouvrir</button>${isP?`<button data-act="usePiece" data-k="${l.id}">Dans la tenue</button>`:''}<button data-act="sheet" data-k="${l.id}">Fiche</button><button data-act="del" data-k="${l.id}">${pendingDel===l.id?'Confirmer':'Retirer'}</button></div></div></div>`;
}
function collection(){
  if(!S.looks.length)return `<div class="pad"><h2>Ma collection</h2><p class="mute">Rien pour l’instant. Crée une pièce dans l’Atelier (mode « Pièce par pièce »), enregistre-la ici, puis assemble tes pièces en tenue.</p><button class="primary" data-act="tab" data-t="studio">Aller à l’Atelier</button></div>`;
  const sh=S.looks.find(l=>l.id===openSheet);
  const pcs=piecesOf(),outs=S.looks.filter(l=>l.kind!=='piece');
  const sec=(t,list)=>list.length?`<h2>${t} (${list.length})</h2><div class="grid">${list.map(lookCard).join('')}</div>`:'';
  return `<div class="pad">
  ${sec('Hauts',pcs.filter(p=>p.cat==='top'))}${sec('Bas',pcs.filter(p=>p.cat==='bottom'))}${sec('Accessoires',pcs.filter(p=>p.cat==='acc'))}${sec('Tenues',outs)}
  ${sh?`<div class="sheet"><pre>${esc(sheetText(sh))}</pre><button class="ghost" data-act="copy" data-k="${sh.id}">Copier la fiche</button><p class="small mute" style="margin:10px 0 0">À envoyer à un atelier ou un patronnier, ou à garder pour refaire la pièce en 3D.</p></div>`:''}
  </div>`;
}

/* ---------- onglet Business ---------- */
function biz(){
  const b=S.biz,f=(k,l,st)=>`<div class="field"><label for="b-${k}">${l}</label><input id="b-${k}" data-in="biz.${k}" type="number" inputmode="decimal" step="${st||'any'}" min="0" value="${b[k]}"></div>`;
  return `<div class="pad">
    <h2>Rentabilité d’une pièce</h2>
    <p class="small mute" style="margin-top:0">Les valeurs de départ sont des exemples : remplace-les par les devis reçus.</p>
    <div class="numgrid">${f('cost','Coût de production (€/pièce)')}${f('price','Prix de vente (€)')}${f('qty','Quantité produite','1')}${f('fixed','Frais fixes (€)')}${f('ship','Emballage et envoi (€/pièce)')}${f('fee','Frais de paiement (%)')}</div>
    <div class="kpis" id="kpis"></div>
    <p class="small mute" id="mult"></p>
    <div class="row2" style="margin-top:8px"><button class="ghost" data-act="mult" data-k="2.5">Prix ×2,5</button><button class="ghost" data-act="mult" data-k="3">Prix ×3</button></div>
    <h2>Check-list de lancement</h2>
    <ul class="checks">${CHECKS.map((c,i)=>`<li><label><input type="checkbox" data-in="chk" data-id="${i}" ${S.checks[i]?'checked':''}><span class="${S.checks[i]?'done':''}">${esc(c[0])}<small>${esc(c[1])}</small></span></label></li>`).join('')}</ul>
  </div>`;
}
function bizCalc(){
  const b=S.biz,n=v=>Number(v)||0;
  const net=n(b.price)*(1-n(b.fee)/100);
  const um=net-n(b.cost)-n(b.ship);
  const pct=n(b.price)>0?um/n(b.price)*100:0;
  const be=um>0?Math.ceil(n(b.fixed)/um):Infinity;
  const inv=n(b.cost)*n(b.qty)+n(b.fixed);
  const all=um*n(b.qty)-n(b.fixed);
  const k=(v,l,cls)=>`<div class="kpi ${cls||''}"><b>${v}</b><span>${l}</span></div>`;
  $('#kpis').innerHTML=k(eur(um),'Marge par pièce',um>0?'pos':'neg')+k(pct.toFixed(0)+' %','Marge sur le prix de vente',um>0?'pos':'neg')+k(isFinite(be)?be+' pièces':'Jamais','Pour rentrer dans tes frais',isFinite(be)?'':'neg')+k(eur(inv),'Investissement de départ')+k(eur(all),'Bénéfice si tout est vendu',all>=0?'pos':'neg');
  $('#mult').textContent=`Repère courant : prix de vente entre ×2,5 et ×3 le coût de production, soit ${eur(n(b.cost)*2.5)} à ${eur(n(b.cost)*3)}.`;
}

/* ---------- onglet Marquage ---------- */
function cmOf(m){const pl=PL[m.place];return pl?Math.round(pl.cm*(Number(m.size)||1)):0}
function markDesc(m,i){
  const K={text:'texte',mono:'monogramme',shape:'symbole'}[m.kind]||'texte';
  const c=m.kind==='shape'?(SHAPES[m.shape]||SHAPES.star).l:(m.text||S.brand.name);
  return `Logo ${i+1} : ${K} (${c}), ${TECH[m.tech]}, ${PL[m.place].l}, environ ${cmOf(m)} cm, ${colorName(m.color)} (${m.color})`+(m.tech==='patch'?`, fond ${colorName(m.bg)} (${m.bg})`:'');
}
function newMark(extra){
  const dark=lum(S.c.tBody)>.55;
  const m=Object.assign({},DEFMARK,{color:dark?'#111214':'#f3f1ea',bg:dark?'#f3f1ea':'#111214'},extra||{});
  return m;
}
function marquage(){
  const m=S.marks[S.mi];
  const pal=[...new Set([...designColors(),...PAL])];
  const sw=(act,cur)=>pal.map(c=>`<button class="sw" data-act="${act}" data-k="${c}" style="background:${c}" aria-label="${colorName(c)}" aria-pressed="${String(cur).toLowerCase()===c.toLowerCase()}"></button>`).join('');
  const stage=`<section class="stage" id="stage"><div class="seg float-l" role="group" aria-label="Vue"><button data-act="view" data-k="front" aria-pressed="${S.view==='front'}">Face</button><button data-act="view" data-k="back" aria-pressed="${S.view==='back'}">Dos</button></div><div id="svgHost">${build(S,'main',null)}</div></section>`;
  const list=`<div class="chips hs">${S.marks.map((x,i)=>`<button class="chip" data-act="mksel" data-k="${i}" aria-pressed="${i===S.mi}">Logo ${i+1}</button>`).join('')}${S.marks.length<8?`<button class="chip" data-act="mkadd">+ Ajouter un logo</button>`:''}</div>`;
  let ed='';
  if(m){
    const places=v=>Object.keys(PL).filter(k=>PL[k].v===v&&(S.mode!=='piece'||MARKCAT[k]===S.cat)).map(k=>`<button class="chip" data-act="mkplace" data-k="${k}" aria-pressed="${m.place===k}">${PL[k].l}</button>`).join('');
    let note='';
    if((m.place==='sleeve-l'||m.place==='sleeve-r')&&(S.top==='vest'||S.top==='jersey'))note='Cette pièce n’a pas de manches : choisis un autre emplacement.';
    if(m.place==='cap'&&S.acc.head==='none')note='Ajoute un couvre-chef dans l’Atelier pour voir ce logo.';
    const kinds={text:'Texte',mono:'Monogramme',shape:'Symbole'};
    ed=`
    <h2>Contenu</h2>
    <div class="chips">${Object.keys(kinds).map(k=>`<button class="chip" data-act="mkkind" data-k="${k}" aria-pressed="${m.kind===k}">${kinds[k]}</button>`).join('')}</div>
    ${m.kind==='shape'?`<div class="shapes" style="margin-top:12px">${Object.keys(SHAPES).map(k=>{const sh=SHAPES[k];return `<button class="shp" data-act="mkshape" data-k="${k}" aria-pressed="${m.shape===k}" aria-label="${sh.l}"><svg viewBox="-13 -13 26 26" width="26" height="26" style="color:var(--ink)">${sh.d?`<path d="${sh.d}" fill="currentColor"/>`:sh.o}</svg></button>`}).join('')}</div>`
    :`<div class="field" style="margin-top:12px"><label for="mk-text">${m.kind==='mono'?'Lettres (1 à 3, vide = initiales de la marque)':'Texte (vide = nom de la marque)'}</label><input id="mk-text" data-in="mk.text" value="${esc(m.text)}" placeholder="${esc(S.brand.name)}" maxlength="24" autocomplete="off"></div>
    <p class="small mute" style="margin:0 0 6px">Style des lettres</p>
    <div class="chips hs"><button class="chip" data-act="mkfont" data-k="" aria-pressed="${!m.font}">Comme la marque</button>${Object.keys(LOGOS).map(k=>`<button class="chip" data-act="mkfont" data-k="${k}" aria-pressed="${m.font===k}">${LOGOS[k].l}</button>`).join('')}</div>`}
    <h2>Emplacement</h2>
    <p class="small mute" style="margin:0 0 6px">Face</p><div class="chips hs">${places('f')}</div>
    <p class="small mute" style="margin:12px 0 6px">Dos</p><div class="chips hs">${places('b')}</div>
    ${note?`<p class="note">${note}</p>`:''}
    <h2>Technique</h2>
    <div class="chips hs">${Object.keys(TECH).map(k=>`<button class="chip" data-act="mktech" data-k="${k}" aria-pressed="${m.tech===k}">${TECH[k]}</button>`).join('')}</div>
    <h2>Couleur</h2>
    <div class="pal" style="margin-top:0">${sw('mkcol',m.color)}<input type="color" class="colorin" data-in="mk.color" value="${m.color}" aria-label="Couleur personnalisée du logo"></div>
    ${m.tech==='patch'?`<p class="small mute" style="margin:14px 0 4px">Fond de l’écusson</p><div class="pal" style="margin-top:0">${sw('mkbg',m.bg)}<input type="color" class="colorin" data-in="mk.bg" value="${m.bg}" aria-label="Couleur du fond de l’écusson"></div>`:''}
    <h2>Taille et position</h2>
    <div class="field"><label for="mk-size">Taille (environ <span id="mkcm">${cmOf(m)} cm</span>)</label><input id="mk-size" type="range" data-in="mk.size" min="0.4" max="3" step="0.05" value="${m.size}"></div>
    <div class="field"><label for="mk-rot">Rotation</label><input id="mk-rot" type="range" data-in="mk.rot" min="-45" max="45" step="1" value="${m.rot}"></div>
    <div class="row2"><div class="field"><label for="mk-dx">Gauche / droite</label><input id="mk-dx" type="range" data-in="mk.dx" min="-30" max="30" step="1" value="${m.dx}"></div><div class="field"><label for="mk-dy">Haut / bas</label><input id="mk-dy" type="range" data-in="mk.dy" min="-30" max="30" step="1" value="${m.dy}"></div></div>
    <button class="ghost" data-act="mkdel" style="width:100%">Supprimer ce logo</button>`;
  }else ed=`<p class="mute">Aucun logo sur la pièce. Ajoute-en un ou pars d’une idée ci-dessous.</p>`;
  return stage+`<div class="pad">${list}${S.mode==='piece'?`<p class="small mute" style="margin:10px 0 0">Mode pièce : seuls les logos de la pièce en cours (${CATS[S.cat].toLowerCase()}) s’affichent sur le mannequin.</p>`:''}${ed}
    <h2>Idées rapides</h2>
    <div class="chips">${QUICK.map((q,i)=>(S.mode==='piece'&&!q.marks.some(m=>MARKCAT[m.place]===S.cat))?'':`<button class="chip" data-act="mkquick" data-k="${i}">${esc(q.n)}</button>`).join('')}</div>
    <p class="small mute" style="margin-top:14px">Les logos suivent le look de l’Atelier et sont enregistrés avec lui dans la collection. Le texte reprend le nom de ta marque tant que tu ne le changes pas.</p>

/* ---------- navigation ---------- */
function renderTab(){
  const v={studio,mark:marquage,brand,coll:collection,biz}[S.tab]||studio;
  $('#app').innerHTML=v();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===S.tab)));
  if(S.tab==='biz')bizCalc();
  setHeader();
}
function go(t){S.tab=t;persist();renderTab();window.scrollTo(0,0)}

/* ---------- événements ---------- */
document.addEventListener('click',e=>{
  const sv=e.target.closest('#svgHost [data-p]');
  if(sv&&S.tab==='studio'){if(zonesOf(S)[sv.dataset.p]){S.sel=sv.dataset.p;persist();renderTab()}return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,k=el.dataset.k;
  switch(a){
    case 'tab':go(el.dataset.t);return;
    case 'view':S.view=k;break;
    case 'random':if(S.mode==='piece')randomPiece();else randomLook();break;
    case 'mode':S.mode=k;S.editId=null;S.sel=Object.keys(zonesOf(S))[0];break;
    case 'cat':S.cat=k;S.editId=null;S.sel=Object.keys(zonesOf(S))[0];break;
    case 'accGroup':S.accGroup=k;S.editId=null;S.sel=ACC[k].z;break;
    case 'fabricB':S.fabricB=k;break;
    case 'savePiece':case 'savePieceNew':{
      const np=makePiece(),ex=(a==='savePiece')&&S.editId&&S.looks.find(l=>l.id===S.editId&&l.kind==='piece'&&l.cat===S.cat);
      if(ex){Object.assign(ex,np,{id:ex.id,name:ex.name});toast('Pièce mise à jour')}
      else{S.looks.push(np);S.editId=np.id;toast('Pièce enregistrée dans ta collection')}
      persist();renderTab();return;
    }
    case 'openPiece':{const pc=S.looks.find(l=>l.id==k);if(pc){applyPiece(pc);S.mode='piece';S.cat=pc.cat;if(pc.cat==='acc')S.accGroup=pc.group;S.editId=pc.id;S.view='front';S.sel=Object.keys(zonesOf(S))[0];go('studio')}return}
    case 'usePiece':{const pc=S.looks.find(l=>l.id==k);if(pc){applyPiece(pc);S.mode='outfit';S.editId=null;S.sel='tBody';S.view='front';toast('Pièce ajoutée à la tenue');go('studio')}return}
    case 'zone':S.sel=k;break;
    case 'col':S.c[S.sel]=k;break;
    case 'top':S.top=k;break;
    case 'bottom':S.bottom=k;break;
    case 'fabric':S.fabric=k;break;
    case 'preset':{const p=PRESETS[+k];S.top=p.top;S.bottom=p.bottom;S.fabric=p.fabric;S.fabricB=p.fabric;S.c=fixC(Object.assign({},S.c,p.c,{stitchB:p.c.stitch}));S.acc=Object.assign({},ACC0,p.acc||{});break}
    case 'acc':S.acc[el.dataset.g]=k;if(k!=='none'&&el.dataset.g!=='shoe')S.sel=ACC[el.dataset.g].z;break;
    case 'save':{
      const n=S.looks.filter(l=>l.kind!=='piece').length+1;
      S.looks.push({id:Date.now(),kind:'outfit',name:'Tenue '+n,top:S.top,bottom:S.bottom,fabric:S.fabric,fabricB:S.fabricB,c:Object.assign({},S.c),acc:Object.assign({},S.acc),marks:JSON.parse(JSON.stringify(S.marks))});
      persist();toast('Tenue ajoutée à ta collection');return;
    }
    case 'mksel':S.mi=+k;{const mm=S.marks[S.mi];if(mm)S.view=PL[mm.place].v==='b'?'back':'front'}break;
    case 'mkadd':{
      if(S.marks.length>=8)return;
      const used=S.marks.map(x=>x.place),free=Object.keys(PL).filter(x=>!used.includes(x)&&x!=='cap'&&(S.mode!=='piece'||MARKCAT[x]===S.cat));
      const m=newMark({place:free[0]||'chest-l'});S.marks.push(m);S.mi=S.marks.length-1;S.view=PL[m.place].v==='b'?'back':'front';break;
    }
    case 'mkdel':S.marks.splice(S.mi,1);S.mi=Math.max(0,S.mi-1);break;
    case 'mkkind':if(S.marks[S.mi])S.marks[S.mi].kind=k;break;
    case 'mkshape':if(S.marks[S.mi])S.marks[S.mi].shape=k;break;
    case 'mkfont':if(S.marks[S.mi])S.marks[S.mi].font=k;break;
    case 'mkplace':if(S.marks[S.mi]){S.marks[S.mi].place=k;S.view=PL[k].v==='b'?'back':'front'}break;
    case 'mktech':if(S.marks[S.mi])S.marks[S.mi].tech=k;break;
    case 'mkcol':if(S.marks[S.mi])S.marks[S.mi].color=k;break;
    case 'mkbg':if(S.marks[S.mi])S.marks[S.mi].bg=k;break;
    case 'mkquick':{
      QUICK[+k].marks.forEach(q=>{if(S.marks.length<8)S.marks.push(newMark(q))});
      S.mi=S.marks.length-1;S.view=PL[S.marks[S.mi].place].v==='b'?'back':'front';break;
    }
    case 'names':genNames();break;
    case 'useName':S.brand.name=k;break;
    case 'vibe':{const v=S.brand.vibes,i=v.indexOf(k);i>=0?v.splice(i,1):v.push(k);break}
    case 'genMan':S.brand.manifesto=manifesto();break;
    case 'logo':S.brand.logo=k;break;
    case 'logoBg':S.brand.bg=k;break;
    case 'logoFg':S.brand.fg=k;break;
    case 'openLook':{const l=S.looks.find(x=>x.id==k);if(l){S.top=l.top;S.bottom=l.bottom;S.fabric=l.fabric;S.fabricB=l.fabricB||l.fabric;S.mode='outfit';S.editId=null;S.c=fixC(Object.assign({},ACCC,l.c));S.acc=Object.assign({},ACC0,l.acc||{});S.marks=(l.marks||[]).map(m=>Object.assign({},DEFMARK,m));S.mi=0;S.view='front';go('studio')}return}
    case 'sheet':openSheet=(openSheet==+k)?null:+k;break;
    case 'del':
      if(pendingDel==+k){S.looks=S.looks.filter(x=>x.id!=k);pendingDel=null;if(openSheet==+k)openSheet=null}
      else{pendingDel=+k;setTimeout(()=>{if(pendingDel==+k){pendingDel=null;if(S.tab==='coll')renderTab()}},3000)}
      break;
    case 'copy':{
      const l=S.looks.find(x=>x.id==k);if(!l)return;
      const txt=sheetText(l);
      const fb=()=>{try{const t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'Fiche copiée':'Copie impossible : sélectionne le texte à la main')}catch(_){toast('Copie impossible : sélectionne le texte à la main')}};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Fiche copiée'),fb)}catch(_){fb()}
      return;
    }
    case 'mult':{S.biz.price=Math.round((Number(S.biz.cost)||0)*Number(k)*100)/100;break}
    default:return;
  }
  persist();renderTab();
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset.in;if(!k)return;
  if(k.startsWith('mk.')){
    const m=S.marks[S.mi];if(!m)return;const pr=k.slice(3);
    m[pr]=(pr==='size'||pr==='rot'||pr==='dx'||pr==='dy')?parseFloat(t.value):t.value;
    if(pr==='size'){const e=$('#mkcm');if(e)e.textContent=cmOf(m)+' cm'}
    refreshStage();persist();return;
  }
  if(k==='custom'){S.c[S.sel]=t.value;refreshStage();persist();return}
  if(k==='name'){S.brand.name=t.value;setHeader();refreshLogo();persist();return}
  if(k==='tag'){S.brand.tag=t.value;refreshLogo();persist();return}
  if(k==='manifesto'){S.brand.manifesto=t.value;persist();return}
  if(k==='lname'){const l=S.looks.find(x=>x.id==t.dataset.id);if(l)l.name=t.value;persist();return}
  if(k.startsWith('biz.')){S.biz[k.slice(4)]=t.value===''?0:parseFloat(t.value);bizCalc();persist();return}
  if(k==='chk'){S.checks[t.dataset.id]=t.checked;persist();const sp=t.nextElementSibling;if(sp)sp.className=t.checked?'done':'';return}
});
renderTab();
</script>
</body>
</html>
